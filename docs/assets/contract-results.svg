<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
  <title id="title">HarnessLab scripted runtime contract results</title>
  <desc id="description">Twelve synthetic cases per configuration. Baseline passes 7 of 12; hardened passes 12 of 12; no evidence gate passes 9 of 12; no retries passes 11 of 12. These are scripted runtime contracts with no live LLM inference, not model accuracy scores.</desc>
  <rect width="1200" height="620" rx="20" fill="#0b1220"/>
  <rect x="36" y="36" width="6" height="50" rx="3" fill="#64e3c0"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="60" y="51" font-size="13" font-weight="700" letter-spacing="2" fill="#64e3c0">HARNESSLAB · RECORDED EXPERIMENT</text>
    <text x="60" y="91" font-size="34" font-weight="700" fill="#edf5ff">What the harness enforces</text>
    <text x="60" y="126" font-size="18" fill="#a5b7ce">12 synthetic cases · 4 configurations · 48 executions</text>
    <rect x="60" y="150" width="1080" height="44" rx="8" fill="#261f1b" stroke="#66513b"/>
    <text x="80" y="178" font-size="16" font-weight="600" fill="#ffd2a5">Scripted runtime contracts · no live LLM inference</text>
    <text x="60" y="230" font-size="13" font-weight="600" fill="#a5b7ce">CONFIGURATION</text>
    <text x="390" y="230" font-size="13" font-weight="600" fill="#a5b7ce">RUNS PASSING ALL THREE GRADERS</text>
    <text x="1138" y="230" text-anchor="end" font-size="13" font-weight="600" fill="#a5b7ce">PASSED / TOTAL</text>
    <g stroke="#28374c" stroke-width="1">
      <path d="M390 244V508 M690 244V508 M990 244V508"/>
    </g>
    <g fill="#1d2d43">
      <rect x="390" y="258" width="600" height="32" rx="6"/>
      <rect x="390" y="328" width="600" height="32" rx="6"/>
      <rect x="390" y="398" width="600" height="32" rx="6"/>
      <rect x="390" y="468" width="600" height="32" rx="6"/>
    </g>
    <g>
      <rect x="390" y="258" width="350" height="32" rx="6" fill="#ffbd7a"/>
      <rect x="390" y="328" width="600" height="32" rx="6" fill="#64e3c0"/>
      <rect x="390" y="398" width="450" height="32" rx="6" fill="#69a7b4"/>
      <rect x="390" y="468" width="550" height="32" rx="6" fill="#69a7b4"/>
    </g>
    <g font-size="19" fill="#edf5ff">
      <text x="60" y="279">baseline</text>
      <text x="60" y="349" font-weight="700" fill="#64e3c0">hardened</text>
      <text x="60" y="419">no-evidence-gate</text>
      <text x="60" y="489">no-retries</text>
    </g>
    <g text-anchor="end" font-size="26" font-weight="700" fill="#edf5ff">
      <text x="1138" y="281">7 / 12</text>
      <text x="1138" y="351" fill="#64e3c0">12 / 12</text>
      <text x="1138" y="421">9 / 12</text>
      <text x="1138" y="491">11 / 12</text>
    </g>
    <g text-anchor="middle" font-size="12" fill="#a5b7ce">
      <text x="390" y="529">0</text><text x="690" y="529">6</text><text x="990" y="529">12</text>
    </g>
    <path d="M60 551H1140" stroke="#28374c"/>
    <text x="60" y="577" font-size="14" fill="#a5b7ce">A pass requires outcome + evidence + safety. This chart does not measure LLM accuracy.</text>
    <text x="60" y="600" font-size="12" fill="#8196b3">Source: examples/demo/results.json · One scripted trial per case and configuration</text>
  </g>
</svg>
