[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harnesslab"
version = "0.1.0"
description = "Durable agent runtime and behavioral evaluation lab for incident diagnosis"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []
keywords = ["ai", "agents", "harness-engineering", "evaluations", "reliability"]

[project.scripts]
harnesslab = "harnesslab.cli:main"

[tool.setuptools.packages.find]
include = ["harnesslab*"]
